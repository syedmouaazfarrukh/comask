# Production Docker Compose for Comask
# Use this for local production testing before Azure deployment

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg18
    container_name: comask-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comask_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-comask}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comask} -d ${POSTGRES_DB:-comask}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: comask-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (production mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comask-backend-prod
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-comask}:${POSTGRES_PASSWORD:-comask_prod_password}@postgres:5432/${POSTGRES_DB:-comask}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-azure_openai}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (production mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: comask-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  default:
    name: comask-network-prod
